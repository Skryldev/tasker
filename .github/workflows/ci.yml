name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  issues: write

jobs:
  backend:
    name: Rust — fmt, clippy, tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo fmt --check
        run: |
          if ! cargo fmt --check; then
            cargo fmt --diff > /tmp/fmt-diff.txt || true
            jq -n --arg title "fmt diff (run ${{ github.run_id }})" \
                  --rawfile body /tmp/fmt-diff.txt \
                  '{title: $title, body: $body}' > /tmp/fmt-payload.json
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/Skryldev/tasker/issues \
              -d @/tmp/fmt-payload.json > /dev/null || true
            exit 1
          fi
      - run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee /tmp/test-out.txt | tail -20
      - name: Surface test failures in the job summary
        if: failure()
        run: |
          {
            echo '### Test failures'
            grep -B2 -A10 'panicked at\|FAILED\|failures:' /tmp/test-out.txt | tail -120
          } >> "$GITHUB_STEP_SUMMARY" || true
          tail -150 /tmp/test-out.txt > /tmp/fail-tail.txt || true
      - name: cargo test
        run: |
          set -o pipefail
          cargo test 2>&1 | tee /tmp/test-out.txt | tail -20

      - name: Report test failures to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tail -150 /tmp/test-out.txt > /tmp/fail-tail.txt || true
          jq -n --arg title "CI test failure (backend, run $RUN_ID)" \
                --rawfile body /tmp/fail-tail.txt \
                '{title: $title, body: $body}' > /tmp/payload.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Skryldev/tasker/issues \
            -d @/tmp/payload.json > /dev/null || true


  frontend:
    name: Frontend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code src/api/schema.d.ts
        name: Verify generated API types are up to date
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build

  openapi:
    name: OpenAPI — lint contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@latest lint api/openapi.yaml --skip-rule=no-empty-servers

  integration-matrix:
    name: Rust — integration on PostgreSQL + MySQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasker_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: tasker_it
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pmysql"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo test --test integration
        run: |
          set -o pipefail
          cargo test --test integration 2>&1 | tee /tmp/it-out.txt | tail -20
        env:
          TASKER_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/tasker_it
          TASKER_TEST_MYSQL_URL: mysql://root:mysql@localhost:3306/tasker_it
      - name: Surface integration failures in the job summary
        if: failure()
        run: |
          {
            echo '### Integration test failures'
            grep -B2 -A10 'panicked at\|FAILED\|failures:' /tmp/it-out.txt | tail -120
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Report integration failures to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tail -150 /tmp/it-out.txt > /tmp/it-fail-tail.txt || true
          jq -n --arg title "CI test failure (integration, run $RUN_ID)" \
                --rawfile body /tmp/it-fail-tail.txt \
                '{title: $title, body: $body}' > /tmp/payload.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/Skryldev/tasker/issues \
            -d @/tmp/payload.json > /dev/null || true

  e2e:
    name: Playwright E2E workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo build
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/e2e.sh
