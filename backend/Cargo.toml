[package]
name = "tasker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tasker — self-hosted team work management platform (backend)"
license = "MIT"

[lib]
name = "tasker"
path = "src/lib.rs"

[[bin]]
name = "tasker"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http2", "matched-path", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header", "timeout"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
    "postgres",
    "mysql",
    "sqlite",
] }

argon2 = "0.5"
rand = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
subtle = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }

thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
url = "2"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
totp-rs = { version = "5", features = ["otpauth"] }
aes-gcm = "0.10"
hmac = "0.12"

[dev-dependencies]
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "db"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
# String building via format-push is the clearest form for SQL fragments.
format_push_string = "allow"
# Long HTTP handlers are readable as request->service->response flows.
too_many_lines = "allow"
# Workflow permission checks take (assignee, reporter, override, manager) flags.
type_complexity = "allow"

# plan_transition arms share fallthrough bodies by design.
match_same_arms = "allow"
