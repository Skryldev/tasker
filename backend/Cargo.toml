[package]
name = "tasker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Tasker — self-hosted team work management platform (backend)"
license = "MIT"

[lib]
name = "tasker"
path = "src/lib.rs"

[[bin]]
name = "tasker"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["http2", "matched-path", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "set-header", "timeout"] }
hyper = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "any",
    "postgres",
    "mysql",
    "sqlite",
] }

argon2 = "0.5"
rand = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
sha2 = "0.10"
subtle = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }

thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
url = "2"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"

[dev-dependencies]
serde_yaml = "0.9"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
