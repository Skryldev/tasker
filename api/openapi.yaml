# Canonical source: api/openapi.json — regenerated, do not hand-edit.
openapi: 3.1.0
info:
  title: Tasker API
  version: 1.0.0
  description: |
    REST API for Tasker, a self-hosted team work management platform.

    ## Conventions

    - **Versioning:** all endpoints live under `/api/v1`. Only additive
      changes (new optional fields, new endpoints) occur within a minor
      version; breaking changes would introduce `/api/v2`.
    - **Errors:** every non-2xx response uses RFC 9457 Problem Details
      (`application/problem+json`) with an optional `errors` extension array
      of `{field, message}` entries for validation failures.
    - **Pagination:** list endpoints use `page` (1-based) and `page_size`
      (1-100, default 25) and return `{items, page, page_size, total}`.
      Results are server-paginated; clients must not assume they can fetch
      an entire collection at once.
    - **Sorting:** `sort` accepts a whitelisted field, `order` is
      `asc`/`desc` (default per endpoint).
    - **Identifiers:** UUIDv7 strings.
    - **Timestamps:** unix epoch milliseconds (UTC integers).
    - **Dates:** `YYYY-MM-DD` strings.

    ## Authentication

    Cookie-based sessions. `POST /auth/login` sets an HttpOnly
    `tasker_session` cookie; browsers send it automatically. State-changing
    requests are additionally checked against allowed origins (CSRF defense).
    Public self-registration may be disabled per deployment; members are
    then provisioned by administrators via `POST /teams/{team_id}/members`.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: goals
  - name: templates
  - name: notifications
  - name: users
  - name: teams
  - name: projects
  - name: tasks
  - name: comments
  - name: activity
  - name: ops
  - name: rules
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      tags:
        - auth
      summary: Authenticate with email and password
      description: Sets the session cookie. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
      responses:
        '200':
          description: |
            Authenticated. Two shapes:
            - users WITHOUT two-factor authentication: the user, session cookie set;
            - users WITH two-factor authentication: `mfa_required` with a
              short-lived, single-use `mfa_token` (no session is issued yet).
              The token is submitted with the code to `POST /auth/2fa/verify`.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/User'
                  - $ref: '#/components/schemas/MfaRequired'
        '401':
          $ref: '#/components/responses/Problem401'
        '429':
          $ref: '#/components/responses/Problem429'
  /auth/2fa/setup:
    post:
      tags:
        - auth
      summary: Begin TOTP two-factor enrollment (normal session required)
      description: |
        Generates a fresh pending TOTP secret, stores it encrypted
        (AES-256-GCM), and returns the `otpauth://` provisioning URI plus the
        Base32 secret for manual entry. MFA is NOT enabled yet. Repeated
        setup replaces the pending secret. Responses are `Cache-Control:
        no-store`. An MFA-pending token cannot call this endpoint.
      responses:
        '200':
          description: Pending provisioning information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '500':
          $ref: '#/components/responses/Problem500'
  /auth/2fa/enable:
    post:
      tags:
        - auth
      summary: Confirm enrollment with a six-digit TOTP code
      description: |
        Verifies the code against the pending secret (window 0: only the
        current 30-second step), atomically enables MFA, and returns ten
        plaintext recovery codes — the only response that ever contains
        them. An invalid code does not enable MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCode'
      responses:
        '200':
          description: MFA enabled; recovery codes returned exactly once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /auth/2fa/verify:
    post:
      tags:
        - auth
      summary: Complete two-factor login (MFA-pending token required)
      description: |
        Accepts either a six-digit TOTP code or a recovery code
        (`XXXX-XXXX`). Rate limited: 5 failed attempts per user per minute
        and 10 per IP per minute (the stricter applies; 429 on excess).
        The MFA-pending token is consumed exactly once on success and a
        normal session cookie is issued. Expired, consumed, or forged
        tokens — and wrong codes — return 401; no session is issued on any
        failed path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerify'
      responses:
        '200':
          description: Two-factor check passed; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem401'
        '429':
          $ref: '#/components/responses/Problem429'
  /auth/2fa/disable:
    post:
      tags:
        - auth
      summary: Disable two-factor authentication (password re-authentication)
      description: |
        Requires the current password. Removes the encrypted TOTP secret and
        recovery codes atomically and invalidates outstanding MFA-pending
        tokens. An MFA-pending token cannot call this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPassword'
      responses:
        '204':
          description: Two-factor authentication disabled.
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
  /auth/2fa/recovery-codes:
    post:
      tags:
        - auth
      summary: Regenerate recovery codes (password re-authentication)
      description: |
        Requires the current password and enabled MFA. Replaces all stored
        recovery-code hashes: every previously issued code is invalidated.
        The new plaintext codes are returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentPassword'
      responses:
        '200':
          description: Ten new recovery codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
  /auth/logout:
    post:
      tags:
        - auth
      summary: Revoke the current session
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401':
          $ref: '#/components/responses/Problem401'
  /auth/register:
    post:
      tags:
        - auth
      summary: Public self-registration (if enabled)
      description: |
        Returns 403 when the deployment disables public registration
        (the default). Members provisioned by admins do not need this.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - display_name
                - password
              properties:
                email:
                  type: string
                  maxLength: 255
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
  /me:
    get:
      tags:
        - users
      summary: Current authenticated user
      responses:
        '200':
          description: The session user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem401'
  /me/password:
    put:
      tags:
        - users
      summary: Change own password
      description: Revokes all other sessions of the user on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
                - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
                  description: >-
                    Strict policy (ADR-0016): >= 12 characters with lower/upper/digit/special, not
                    blocklisted, not equal to email/username/display name, and different from the
                    current password.
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
  /me/tasks:
    get:
      tags:
        - users
      summary: Tasks assigned to the current user across all teams
      parameters:
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated assigned tasks with team/project context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyTasks'
        '401':
          $ref: '#/components/responses/Problem401'
  /teams:
    get:
      tags:
        - teams
      summary: List teams the caller belongs to
      responses:
        '200':
          description: Teams with the caller's role.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Problem401'
    post:
      tags:
        - teams
      summary: Create a team (caller becomes Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Team created; caller is Owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'
  /teams/{team_id}:
    get:
      tags:
        - teams
      summary: Team details (requires membership)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Team with caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      tags:
        - teams
      summary: Update team details (Owner/Admin)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                description:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
  /teams/{team_id}/members:
    get:
      tags:
        - teams
      summary: List team members (requires membership)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Members ordered by join date.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/Problem404'
    post:
      tags:
        - teams
      summary: Assign an existing instance user to the team (Owner/Admin)
      description: >-
        Bug 2 (ADR-0014): team membership no longer creates accounts. Unknown email → 422 with an
        actionable message.
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: >-
                    An existing instance user (Bug 2). Unknown emails get 422 — accounts are created
                    by an Owner via /admin/users.
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - manager
                    - member
                    - guest
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /teams/{team_id}/members/{user_id}:
    patch:
      tags:
        - teams
      summary: Change a member's role (Owner/Admin)
      description: |
        Owners can change any role; Admins can change roles of non-owner
        members but can never grant or modify `owner`. The last owner
        cannot be demoted and members cannot change their own role.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum:
                    - owner
                    - admin
                    - manager
                    - member
      responses:
        '200':
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
    delete:
      tags:
        - teams
      summary: Remove a member (Owner/Admin)
      description: |
        Owners can remove anyone (except themselves); Admins can remove
        Manager/Member roles only. The last owner cannot be removed. The
        member's task assignments are cleared.
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Member removed.
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /teams/{team_id}/labels:
    get:
      tags:
        - teams
      summary: List team labels (requires membership)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      responses:
        '200':
          description: Labels ordered by name.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Label'
        '404':
          $ref: '#/components/responses/Problem404'
    post:
      tags:
        - teams
      summary: Create a label (Owner/Admin/Manager)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                color:
                  type: string
                  pattern: ^#[0-9a-fA-F]{6}$
                icon:
                  type: string
                  maxLength: 64
                  description: Optional whitelisted Lucide icon name.
      responses:
        '201':
          description: Label created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '403':
          $ref: '#/components/responses/Problem403'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /teams/{team_id}/projects:
    get:
      tags:
        - projects
      summary: List team projects
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: include_archived
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Projects with open task counts.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/Problem404'
    post:
      tags:
        - projects
      summary: Create a project (Owner/Admin/Manager)
      parameters:
        - $ref: '#/components/parameters/TeamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: string
                  maxLength: 2000
                owner_id:
                  description: Project owner; must be a team member. Defaults to caller.
                  type: string
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
  /projects/{project_id}:
    get:
      tags:
        - projects
      summary: Project details (requires team membership)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      tags:
        - projects
      summary: Update project (Owner/Admin/Manager; archived projects are read-only)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  type: string
                  maxLength: 2000
                owner_id:
                  type: string
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /projects/{project_id}/archive:
    post:
      tags:
        - projects
      summary: Archive a project (Owner/Admin/Manager)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /projects/{project_id}/unarchive:
    post:
      tags:
        - projects
      summary: Restore an archived project (Owner/Admin/Manager)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Active project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /projects/{project_id}/tasks:
    get:
      tags:
        - tasks
      summary: List project tasks (root tasks; server-side pagination)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskStatusFilter'
        - $ref: '#/components/parameters/TaskPriorityFilter'
        - name: assignee_id
          in: query
          schema:
            type: string
          description: User id, or `none` for unassigned tasks.
        - name: label_id
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
            maxLength: 200
          description: Case-insensitive substring search over title and description.
        - name: due_before
          in: query
          schema:
            type: string
            format: date
        - name: due_after
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paginated tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTasks'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
    post:
      tags:
        - tasks
      summary: Create a task (all roles; archived projects reject)
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /projects/{project_id}/board:
    get:
      tags:
        - tasks
      summary: Kanban board — tasks grouped by status
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum cards per column; totals are unaffected.
      responses:
        '200':
          description: Board columns in canonical status order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '404':
          $ref: '#/components/responses/Problem404'
  /tasks/{task_id}:
    get:
      tags:
        - tasks
      summary: Task detail with labels and subtasks (requires team membership)
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/Problem404'
    patch:
      tags:
        - tasks
      summary: Update a task
      description: |
        Owner/Admin/Manager can update any task. Members can update tasks
        they created or are assigned to, but may only assign tasks to
        themselves and cannot edit labels. Every changed field is recorded
        in the task's activity history.

        Status changes are not accepted here — a request containing `status`
        is rejected with 400; lifecycle transitions must use
        `POST /tasks/{task_id}/transition`. A change that would leave one
        person as both assignee and reporter is rejected with 422.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Problem400'
        '403':
