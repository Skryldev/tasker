      responses:
        '204':
          description: No content. Task-label rows cascade; tasks are untouched.
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /tasks/{task_id}/attachments:
    get:
      tags:
        - tasks
      summary: List task attachments
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Attachments oldest-first; soft-deleted excluded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentList'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
    post:
      tags:
        - tasks
      summary: Upload an attachment (multipart)
      description: >-
        Multipart form with exactly one `file` part. Task editors only; closed tasks and archived
        projects reject with 409.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: At most TASKER_ATTACHMENTS_MAX_MB (default 25 MB); empty files are rejected.
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          description: Payload too large (exceeds the configured attachment limit).
        '422':
          $ref: '#/components/responses/Problem422'
  /attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - tasks
      summary: Download an attachment
      responses:
        '200':
          description: >-
            Raw bytes with the stored MIME type, `Content-Disposition: attachment` and
            `X-Content-Type-Options: nosniff`.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
    delete:
      tags:
        - tasks
      summary: Soft-delete an attachment (task editors only)
      responses:
        '204':
          description: No content.
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
  /admin/users:
    get:
      tags:
        - admin
      summary: List instance users (Owner-only)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Match email, display name or username.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Instance users, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
    post:
      tags:
        - admin
      summary: Create an instance user (Owner-only)
      description: >-
        Creates a Tasker account WITHOUT team membership (ADR-0014); assignment to teams is a
        separate action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdminUserRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
  /admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - admin
      summary: Update an instance user (Owner-only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdminUserRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
    delete:
      tags:
        - admin
      summary: Deactivate, or guarded hard delete (Owner-only)
      description: >-
        Without a body the account is deactivated. With `confirm_email` + `current_password` a hard
        delete is attempted; it is refused (409) while the account has team memberships, created
        tasks or comments.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAdminUserRequest'
      responses:
        '204':
          description: Deactivated or deleted.
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
  /teams/{team_id}/members/eligible:
    get:
      tags:
        - teams
      summary: Search users eligible to join the team (Owner/Admin)
      description: >-
        Existing instance users only; current members are excluded (Bug 2: assignment never creates
        accounts).
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Eligible users by display name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleMemberList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
  /teams/{team_id}/tasks:
    get:
      tags:
        - tasks
      summary: Team-wide task search (membership)
      parameters:
        - $ref: '#/components/parameters/TeamId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Title substring.
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Team tasks, newest update first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamTaskSearchList'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tasker_session
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RuleId:
      name: rule_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: goal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyResultId:
      name: key_result_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum:
          - created_at
          - updated_at
          - due_date
          - priority
          - title
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
          - asc
          - desc
    TaskStatusFilter:
      name: status
      in: query
      description: Comma-separated status values.
      schema:
        type: string
        example: todo,in_progress
    TaskPriorityFilter:
      name: priority
      in: query
      description: Comma-separated priority values.
      schema:
        type: string
        example: high,urgent
  responses:
    Problem401:
      description: Authentication required.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: Insufficient permissions.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem400:
      description: Bad request (e.g. a status field on the generic task update).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: Resource not found (or not visible to the caller).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflict with current state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: Internal error (e.g. two-factor authentication is not configured on this deployment).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Rate limited.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with a field-error extension.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          example: https://tasker.dev/problems/validation-failed
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    User:
      type: object
      required:
        - id
        - email
        - display_name
        - created_at
        - mfa_enabled
        - username
        - bio
        - timezone
        - notification_prefs
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: integer
          description: epoch milliseconds
        mfa_enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enabled for this account.
        capacity_limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
        username:
          type:
            - string
            - 'null'
          pattern: ^[a-z0-9_]{3,32}$
          description: Unique @mention handle.
        bio:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Short bio.
        timezone:
          type:
            - string
            - 'null'
          description: IANA timezone.
        notification_prefs:
          $ref: '#/components/schemas/NotificationPrefs'
        instance_role:
          type:
            - string
            - 'null'
          enum:
            - owner
            - member
            - null
          description: Instance-wide role (Bug 2). `owner` manages every Tasker account.
    MfaRequired:
      type: object
      required:
        - mfa_required
        - mfa_token
      properties:
        mfa_required:
          type: boolean
          description: Always true in this response shape.
        mfa_token:
          type: string
          maxLength: 512
          description: |
            Single-use, 10-minute MFA-pending credential bound to the
            authenticated user. It authorizes only `POST /auth/2fa/verify`.
    MfaSetup:
      type: object
      required:
        - uri
        - secret
        - issuer
        - account
      properties:
        uri:
          type: string
          description: otpauth:// provisioning URI to encode as a QR code locally.
        secret:
          type: string
          description: Base32 secret for manual authenticator entry.
        issuer:
          type: string
        account:
          type: string
          format: email
    TotpCode:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Six-digit TOTP code from the authenticator.
    MfaVerify:
      type: object
      required:
        - mfa_token
        - code
      properties:
        mfa_token:
          type: string
          maxLength: 512
        code:
          type: string
          minLength: 6
          maxLength: 9
          description: |
            Six-digit TOTP code, or a recovery code in `XXXX-XXXX` form
            (separators optional, case-insensitive).
    CurrentPassword:
      type: object
      required:
        - current_password
      properties:
        current_password:
          type: string
    RecoveryCodes:
      type: object
      required:
        - recovery_codes
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            description: '`XXXX-XXXX`; shown exactly once at issuance or regeneration.'
    UserBrief:
      type: object
      required:
        - id
        - display_name
        - email
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
    Team:
      type: object
      required:
        - id
        - name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        created_at:
          type: integer
        updated_at:
          type: integer
        my_role:
          type:
            - string
            - 'null'
          enum:
            - owner
            - admin
            - manager
            - member
            - null
        archived_at:
          type:
            - integer
            - 'null'
          description: Archive timestamp.
        timezone:
          type:
            - string
            - 'null'
          description: Default timezone.
    Member:
      type: object
      required:
        - user
        - role
        - created_at
      properties:
        user:
          $ref: '#/components/schemas/UserBrief'
        role:
          type: string
          enum:
            - owner
            - admin
            - manager
            - member
        created_at:
          type: integer
        username:
          type:
            - string
            - 'null'
          description: The member's @mention handle.
    Label:
      type: object
      required:
        - id
        - name
        - color
        - created_at
        - icon
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        created_at:
          type: integer
        icon:
          type:
            - string
            - 'null'
          maxLength: 64
          description: >-
            Optional Lucide icon name from the app whitelist (see `LABEL_ICONS` in the API); null =
            no icon.
    LabelBrief:
      type: object
      required:
        - id
        - name
        - color
        - icon
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
        icon:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Optional Lucide icon name from the app whitelist.
    Project:
      type: object
      required:
        - id
        - team_id
        - name
        - status
        - owner_id
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - active
            - archived
        owner_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        created_at:
          type: integer
        updated_at:
          type: integer
        open_task_count:
          type: integer
        my_role:
          type:
            - string
            - 'null'
          enum:
            - owner
            - admin
            - manager
            - member
            - null
        is_guest:
          type: boolean
          description: True when the caller reaches this project through a guest grant (read-only).
    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 250
        description:
          type: string
          maxLength: 10000
        status:
          type: string
          enum:
            - backlog
            - todo
            - in_progress
          description: >-
            New tasks start in an actionable state; later lifecycle states are reached only via
            transitions.
        reporter_id:
          type:
            - string
            - 'null'
          description: |
            Acceptance reviewer. Defaults to the caller; selecting another
            user requires the Manager role or above and must be a team
            member. The assignee and reporter must be different users — a
            creation request that gives one person both roles is rejected.
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
            - urgent
            - critical
        assignee_id:
          type:
            - string
            - 'null'
          description: Must be a team member.
        due_date:
          type:
            - string
            - 'null'
          format: date
        parent_task_id:
          type:
            - string
            - 'null'
          description: Subtask parent; must be a root task in the same project.
        label_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        deadline:
          type: string
          format: date
          description: Hard cutoff; must be >= due_date when both set.
    TaskUpdate:
      type: object
      minProperties: 1
      description: |
        Field edits only. Status changes are rejected with 400 — lifecycle
        transitions must use `POST /tasks/{task_id}/transition`. The assignee
        and reporter must remain different users; a change that would give
        one person both roles is rejected with 422.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 250
        description:
          type:
            - string
            - 'null'
          maxLength: 10000
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
            - urgent
            - critical
        assignee_id:
          type:
            - string
            - 'null'
          description: Team member id; empty string clears the assignment.
        reporter_id:
          type:
            - string
            - 'null'
          description: |
            Acceptance reviewer. Changes require the Manager role or above
            and must reference a member; the assignee and reporter must be
            different users.
        due_date:
          type:
            - string
            - 'null'
          format: date
        label_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
        deadline:
          oneOf:
            - type: string
              format: date
              description: Hard cutoff; must be >= due_date when both set.
            - type: 'null'
              description: Clears the deadline.
    Task:
      type: object
      required:
        - id
        - team_id
        - project_id
        - title
        - status
        - priority
        - position
        - labels
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        team_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        parent_task_id:
          type:
            - string
            - 'null'
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - backlog
            - todo
            - in_progress
            - resolved
            - in_review
            - closed
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
            - urgent
            - critical
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        reporter:
          description: User responsible for accepting or rejecting the work.
          oneOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        created_by:
          oneOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        resolution:
          description: >-
            Latest acceptance decision; set on acceptance (closing) or rejection (returning to In
            Progress), cleared when work restarts.
          type:
            - string
            - 'null'
          enum:
            - accepted
            - rejected
            - null
        resolution_note:
          type:
            - string
            - 'null'
        resolved_by:
          oneOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        resolved_at:
          type:
            - integer
            - 'null'
          description: epoch ms of the latest decision
        due_date:
          type:
            - string
            - 'null'
          format: date
        position:
          type: number
        completed_at:
          type:
            - integer
            - 'null'
          description: epoch ms; set when the reporter accepts the task (status closed)
        labels:
          type: array
          items:
            $ref: '#/components/schemas/LabelBrief'
        created_at:
          type: integer
        updated_at:
          type: integer
        subtasks:
          type: array
          description: Present in task detail responses (one nesting level).
          items:
            $ref: '#/components/schemas/Task'
        deadline:
          type:
            - string
            - 'null'
          description: Hard cutoff; app enforces deadline >= due_date.
        from_template_id:
          type:
            - string
            - 'null'
          description: Template provenance.
    PaginatedTasks:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    PaginatedMyTasks:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Task'
              - type: object
                required:
                  - team_name
                  - project_name
                properties:
                  team_name:
                    type: string
