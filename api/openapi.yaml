            $ref: '#/components/schemas/TrashProject'
    CapacityMember:
      type: object
      required:
        - user_id
        - display_name
        - avatar_url
        - open_tasks
        - overdue_tasks
        - capacity_limit
        - utilization
        - status
      properties:
        user_id:
          type: string
          format: uuid
        display_name:
          type: string
        avatar_url:
          type: string
        open_tasks:
          type: integer
        overdue_tasks:
          type: integer
        due_this_week:
          type:
            - integer
            - 'null'
          description: Open tasks due within the next 7 days; null unless window=week.
        due_this_month:
          type:
            - integer
            - 'null'
          description: Open tasks due within the next 30 days; null unless window=month.
        due_in_window:
          type: integer
          description: Open tasks due within the requested window.
        capacity_limit:
          type: integer
          minimum: 1
          maximum: 100
        utilization:
          type: number
          description: open_tasks / capacity_limit, clamped to 0-2.
        status:
          type: string
          enum:
            - underutilized
            - balanced
            - overloaded
    CapacityResponse:
      type: object
      required:
        - window_days
        - summary
        - items
      properties:
        window_days:
          type: integer
          enum:
            - 7
            - 30
        summary:
          type: object
          required:
            - total_open_tasks
            - total_capacity
            - utilization
          properties:
            total_open_tasks:
              type: integer
            total_capacity:
              type: integer
            utilization:
              type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/CapacityMember'
    CreateCommentRequest:
      type: object
      properties:
        parent_comment_id:
          type: string
          description: Parent comment id for a threaded reply; replying to a reply is a 422 (depth 2).
    UpsertTemplateRequest:
      type: object
      properties:
        default_subtasks:
          type: array
          items:
            type: string
          maxItems: 20
    FromTemplateRequest:
      type: object
      description: >-
        Overrides applied on top of the template's defaults. Absent fields keep the template
        default.
      properties:
        title:
          type: string
        default_description:
          type: string
        priority:
          type: string
          enum:
            - none
            - low
            - medium
            - high
            - urgent
            - critical
        assignee_id:
          type: string
          format: uuid
        due_date:
          type: string
          format: date
        subtasks:
          type: array
          items:
            type: string
          maxItems: 20
        status:
          type: string
          enum:
            - backlog
            - todo
            - in_progress
          description: Overrides the creation status (actionable states only).
        label_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Overrides the template's default label set.
    FromTemplateTask:
      type: object
      description: The created task (Task shape) with from_template_id provenance.
      allOf:
        - $ref: '#/components/schemas/Task'
    ChecklistItem:
      type: object
      required:
        - id
        - task_id
        - title
        - is_checked
        - position
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        is_checked:
          type: boolean
        position:
          type: number
        created_at:
          type: integer
        updated_at:
          type: integer
    ChecklistItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
    CreateChecklistItemRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 200
        position:
          type: number
    UpdateChecklistItemRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        is_checked:
          type: boolean
    TaskProgress:
      type: object
      required:
        - subtasks_total
        - subtasks_closed
        - checklist_total
        - checklist_checked
      properties:
        subtasks_total:
          type: integer
        subtasks_closed:
          type: integer
        checklist_total:
          type: integer
        checklist_checked:
          type: integer
        progress_pct:
          type:
            - integer
            - 'null'
          description: 0-100; null when nothing to track.
    DashboardKpis:
      type: object
      required:
        - throughput
        - throughput_prev
        - cycle_time_days
        - lead_time_days
        - wip
        - overdue
        - deadline_risk
        - review_load
        - priority_mix
      properties:
        throughput:
          type: integer
          description: Tasks closed in the window.
        throughput_prev:
          type: integer
          description: Tasks closed in the previous window.
        cycle_time_days:
          type:
            - number
            - 'null'
          description: Avg days from first in_progress to close (null when no matches).
        lead_time_days:
          type:
            - number
            - 'null'
          description: Avg days from creation to close (null when no matches).
        wip:
          type: integer
          description: Open tasks currently in_progress or in_review.
        overdue:
          type: integer
          description: Open tasks past their due date.
        deadline_risk:
          type: integer
          description: Open tasks with a deadline within the next 7 days.
        review_load:
          type: integer
          description: Tasks currently in review.
        priority_mix:
          type: object
          additionalProperties:
            type: integer
          description: Open task count per priority level.
        capacity_utilization:
          type:
            - number
            - 'null'
          description: Team-wide assigned-open / capacity, clamped to 2.0; null when no member sets capacity.
    DashboardReviewRow:
      type: object
      required:
        - reporter_id
        - display_name
        - count
      properties:
        reporter_id:
          type: string
          format: uuid
        display_name:
          type: string
        count:
          type: integer
    DashboardResponse:
      type: object
      required:
        - window_days
        - kpis
        - review_by_reporter
      properties:
        window_days:
          type: integer
          enum:
            - 7
            - 30
            - 90
        kpis:
          $ref: '#/components/schemas/DashboardKpis'
        review_by_reporter:
          type: array
          items:
            $ref: '#/components/schemas/DashboardReviewRow'
    UpdateLabelRequest:
      type: object
      description: Label fields to change. Absent fields are untouched.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
        icon:
          oneOf:
            - type: string
              maxLength: 64
              description: Whitelisted Lucide icon name.
            - type: 'null'
              description: Clears the icon.
    Attachment:
      type: object
      required:
        - id
        - task_id
        - filename
        - mime_type
        - size_bytes
        - created_at
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        filename:
          type: string
          maxLength: 255
        mime_type:
          type: string
        size_bytes:
          type: integer
          description: Stored byte size.
        uploaded_by:
          oneOf:
            - $ref: '#/components/schemas/UserBrief'
            - type: 'null'
        created_at:
          type: integer
    AttachmentList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    AdminUserTeamRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    AdminUser:
      type: object
      required:
        - id
        - email
        - display_name
        - instance_role
        - active
        - created_at
        - teams
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        username:
          type:
            - string
            - 'null'
        instance_role:
          type: string
          enum:
            - owner
            - member
        active:
          type: boolean
          description: Deactivated accounts cannot sign in.
        created_at:
          type: integer
        teams:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserTeamRef'
    AdminUserList:
      type: object
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    CreateAdminUserRequest:
      type: object
      required:
        - email
        - display_name
        - temporary_password
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
        temporary_password:
          type: string
          description: >-
            Must satisfy the strict password policy (ADR-0016): >= 12 chars with
            lower/upper/digit/special, not blocklisted, not derived from the account identity.
    UpdateAdminUserRequest:
      type: object
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        username:
          oneOf:
            - type: string
              pattern: ^[a-z0-9_]{3,32}$
            - type: 'null'
        active:
          type: boolean
          description: false deactivates (sessions revoked); true reactivates.
    DeleteAdminUserRequest:
      type: object
      description: Required for a guarded hard delete; absent body soft-deactivates.
      properties:
        confirm_email:
          type: string
          description: The target account's email, typed verbatim.
        current_password:
          type: string
          description: The requesting owner's password.
    EligibleMember:
      type: object
