openapi: 3.1.0
info:
  title: Tasker API
  version: 1.0.0
  description: |
    REST API for Tasker, a self-hosted team work management platform.

    ## Conventions

    - **Versioning:** all endpoints live under `/api/v1`. Only additive
      changes (new optional fields, new endpoints) occur within a minor
      version; breaking changes would introduce `/api/v2`.
    - **Errors:** every non-2xx response uses RFC 9457 Problem Details
      (`application/problem+json`) with an optional `errors` extension array
      of `{field, message}` entries for validation failures.
    - **Pagination:** list endpoints use `page` (1-based) and `page_size`
      (1-100, default 25) and return `{items, page, page_size, total}`.
      Results are server-paginated; clients must not assume they can fetch
      an entire collection at once.
    - **Sorting:** `sort` accepts a whitelisted field, `order` is
      `asc`/`desc` (default per endpoint).
    - **Identifiers:** UUIDv7 strings.
    - **Timestamps:** unix epoch milliseconds (UTC integers).
    - **Dates:** `YYYY-MM-DD` strings.

    ## Authentication

    Cookie-based sessions. `POST /auth/login` sets an HttpOnly
    `tasker_session` cookie; browsers send it automatically. State-changing
    requests are additionally checked against allowed origins (CSRF defense).
    Public self-registration may be disabled per deployment; members are
    then provisioned by administrators via `POST /teams/{team_id}/members`.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: notifications
  - name: users
  - name: teams
  - name: projects
  - name: tasks
  - name: comments
  - name: activity
  - name: ops
security:
  - cookieAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      description: Sets the session cookie. Rate limited per client IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  maxLength: 255
                password:
                  type: string
      responses:
        "200":
          description: Authenticated; session cookie set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem401"
        "429":
          $ref: "#/components/responses/Problem429"
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      responses:
        "204":
          description: Session revoked and cookie cleared.
        "401":
          $ref: "#/components/responses/Problem401"
  /auth/register:
    post:
      tags: [auth]
      summary: Public self-registration (if enabled)
      description: |
        Returns 403 when the deployment disables public registration
        (the default). Members provisioned by admins do not need this.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, password]
              properties:
                email: { type: string, maxLength: 255 }
                display_name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Problem403"
        "422":
          $ref: "#/components/responses/Problem422"
  /me:
    get:
      tags: [users]
      summary: Current authenticated user
      responses:
        "200":
          description: The session user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem401"
  /me/password:
    put:
      tags: [users]
      summary: Change own password
      description: Revokes all other sessions of the user on success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "204":
          description: Password changed.
        "401":
          $ref: "#/components/responses/Problem401"
        "422":
          $ref: "#/components/responses/Problem422"
  /me/tasks:
    get:
      tags: [users]
      summary: Tasks assigned to the current user across all teams
      parameters:
        - $ref: "#/components/parameters/TaskStatusFilter"
        - $ref: "#/components/parameters/TaskPriorityFilter"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated assigned tasks with team/project context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMyTasks"
        "401":
          $ref: "#/components/responses/Problem401"

  /teams:
    get:
      tags: [teams]
      summary: List teams the caller belongs to
      responses:
        "200":
          description: Teams with the caller's role.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Problem401"
    post:
      tags: [teams]
      summary: Create a team (caller becomes Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Team created; caller is Owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Problem401"
        "422":
          $ref: "#/components/responses/Problem422"
  /teams/{team_id}:
    get:
      tags: [teams]
      summary: Team details (requires membership)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Team with caller's role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/Problem404"
    patch:
      tags: [teams]
      summary: Update team details (Owner/Admin)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
  /teams/{team_id}/members:
    get:
      tags: [teams]
      summary: List team members (requires membership)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Members ordered by join date.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "404":
          $ref: "#/components/responses/Problem404"
    post:
      tags: [teams]
      summary: Add a member (Owner/Admin)
      description: |
        Administrator-assisted provisioning: if no user exists with the
        email, one is created using `temp_password` (min 10 chars), which
        the administrator hands to the member out-of-band. If the user
        exists, only the membership is added. Granting the `owner` role
        requires the caller to be Owner.
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, maxLength: 255 }
                display_name: { type: string, maxLength: 120 }
                role:
                  type: string
                  enum: [owner, admin, manager, member]
                temp_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "201":
          description: Membership created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
  /teams/{team_id}/members/{user_id}:
    patch:
      tags: [teams]
      summary: Change a member's role (Owner/Admin)
      description: |
        Owners can change any role; Admins can change roles of non-owner
        members but can never grant or modify `owner`. The last owner
        cannot be demoted and members cannot change their own role.
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, manager, member] }
      responses:
        "200":
          description: Role changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
    delete:
      tags: [teams]
      summary: Remove a member (Owner/Admin)
      description: |
        Owners can remove anyone (except themselves); Admins can remove
        Manager/Member roles only. The last owner cannot be removed. The
        member's task assignments are cleared.
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Member removed.
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
  /teams/{team_id}/labels:
    get:
      tags: [teams]
      summary: List team labels (requires membership)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: Labels ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "404":
          $ref: "#/components/responses/Problem404"
    post:
      tags: [teams]
      summary: Create a label (Owner/Admin/Manager)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                color:
                  type: string
                  pattern: "^#[0-9a-fA-F]{6}$"
      responses:
        "201":
          description: Label created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "403":
          $ref: "#/components/responses/Problem403"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"

  /teams/{team_id}/projects:
    get:
      tags: [projects]
      summary: List team projects
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Projects with open task counts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Problem404"
    post:
      tags: [projects]
      summary: Create a project (Owner/Admin/Manager)
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                owner_id:
                  description: Project owner; must be a team member. Defaults to caller.
                  type: string
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
  /projects/{project_id}:
    get:
      tags: [projects]
      summary: Project details (requires team membership)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/Problem404"
    patch:
      tags: [projects]
      summary: Update project (Owner/Admin/Manager; archived projects are read-only)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                owner_id: { type: string }
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
  /projects/{project_id}/archive:
    post:
      tags: [projects]
      summary: Archive a project (Owner/Admin/Manager)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Archived project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
  /projects/{project_id}/unarchive:
    post:
      tags: [projects]
      summary: Restore an archived project (Owner/Admin/Manager)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Active project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"

  /projects/{project_id}/tasks:
    get:
      tags: [tasks]
      summary: List project tasks (root tasks; server-side pagination)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskStatusFilter"
        - $ref: "#/components/parameters/TaskPriorityFilter"
        - name: assignee_id
          in: query
          schema: { type: string }
          description: User id, or `none` for unassigned tasks.
        - name: label_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive substring search over title and description.
        - name: due_before
          in: query
          schema: { type: string, format: date }
        - name: due_after
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTasks"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
    post:
      tags: [tasks]
      summary: Create a task (all roles; archived projects reject)
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
  /projects/{project_id}/board:
    get:
      tags: [tasks]
      summary: Kanban board — tasks grouped by status
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Maximum cards per column; totals are unaffected.
      responses:
        "200":
          description: Board columns in canonical status order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          $ref: "#/components/responses/Problem404"
  /tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Task detail with labels and subtasks (requires team membership)
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/Problem404"
    patch:
      tags: [tasks]
      summary: Update a task
      description: |
        Owner/Admin/Manager can update any task. Members can update tasks
        they created or are assigned to, but may only assign tasks to
        themselves and cannot edit labels. Every changed field is recorded
        in the task's activity history.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"
    delete:
      tags: [tasks]
      summary: Delete a task
      description: |
        Owner/Admin/Manager can delete any task; members only tasks they
        created. Subtasks are deleted with their parent (documented
        cascade semantics). The deletion is recorded as project-level
        activity.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Task deleted.
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
  /tasks/{task_id}/subtasks:
    post:
      tags: [tasks]
      summary: Create a subtask
      description: The parent must be a root task in the same project.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
      responses:
        "201":
          description: Subtask created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"

  /tasks/{task_id}/comments:
    get:
      tags: [comments]
      summary: List task comments
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated comments (oldest first).
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        "404":
          $ref: "#/components/responses/Problem404"
    post:
      tags: [comments]
      summary: Add a comment (any team member)
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: Comment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "422":
          $ref: "#/components/responses/Problem422"
  /comments/{comment_id}:
    patch:
      tags: [comments]
      summary: Edit a comment (author, or Owner/Admin)
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "200":
          description: Updated comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
    delete:
      tags: [comments]
      summary: Delete a comment (author, or Owner/Admin/Manager)
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: Comment deleted.
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"

  /tasks/{task_id}/activity:
    get:
      tags: [activity]
      summary: Task activity history (latest 100 events)
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Activity events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
        "404":
          $ref: "#/components/responses/Problem404"

  /tasks/{task_id}/submit:
    post:
      tags: [tasks]
      summary: Submit the task for the reporter's acceptance
      description: |
        Moves an In Progress task to In Review. Allowed for the assignee,
        the task creator (for unassigned work), or Manager roles and above.
        The reporter is notified. Clears any previous resolution: a new
        review cycle never inherits an old decision.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task is now In Review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
  /tasks/{task_id}/accept:
    post:
      tags: [tasks]
      summary: Accept a task awaiting review (In Review -> Done)
      description: |
        Only the designated reporter, or an Owner/Admin reviewer override,
        may accept — never the assignee, even when they are also the
        reporter (that reporter role is not independent). Records
        `resolution=accepted`, the resolver, and the timestamp.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
  /tasks/{task_id}/reject:
    post:
      tags: [tasks]
      summary: Reject a task awaiting review (In Review -> In Progress)
      description: |
        The mirror of accept: the reporter (or Owner/Admin override, never
        the assignee) returns the work with a required, audited reason.
        Records `resolution=rejected`, the note, resolver, and timestamp;
        the assignee is notified with the reason.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskReject"
      responses:
        "200":
          description: Task returned to In Progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "403":
          $ref: "#/components/responses/Problem403"
        "404":
          $ref: "#/components/responses/Problem404"
        "409":
          $ref: "#/components/responses/Problem409"
        "422":
          $ref: "#/components/responses/Problem422"

  /notifications:
    get:
      tags: [notifications]
      summary: List the authenticated user's notifications
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recipient-scoped notifications, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNotifications"
        "401":
          $ref: "#/components/responses/Problem401"
  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: Unread notification count for the authenticated user
      responses:
        "200":
          description: Current unread count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, minimum: 0 }
        "401":
          $ref: "#/components/responses/Problem401"
  /notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every unread notification of the caller as read
      responses:
        "204":
          description: All notifications marked read.
        "401":
          $ref: "#/components/responses/Problem401"
  /notifications/{notification_id}/read:
    post:
      tags: [notifications]
      summary: Mark one notification as read (idempotent)
      description: Scoped to the authenticated recipient; foreign or unknown
        ids return 404 without disclosing existence.
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Marked read (or already read).
        "401":
          $ref: "#/components/responses/Problem401"
        "404":
          $ref: "#/components/responses/Problem404"

  /health/live:
    get:
      tags: [ops]
      summary: Liveness probe
      description: Always responds 200 while the process runs; does not touch the database.
      security: []
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string }
  /health/ready:
    get:
      tags: [ops]
      summary: Readiness probe
      description: Verifies database connectivity; 503 while degraded.
      security: []
      responses:
        "200":
          description: Ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string }
                  database: { type: string }
        "503":
          description: Not ready (database unreachable).
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string }
                  database: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tasker_session
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Sort:
      name: sort
      in: query
      schema:
        type: string
        enum: [created_at, updated_at, due_date, priority, title]
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    TaskStatusFilter:
      name: status
      in: query
      description: Comma-separated status values.
      schema:
        type: string
        example: "todo,in_progress"
    TaskPriorityFilter:
      name: priority
      in: query
      description: Comma-separated priority values.
      schema:
        type: string
        example: "high,urgent"
  responses:
    Problem401:
      description: Authentication required.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem403:
      description: Insufficient permissions.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem404:
      description: Resource not found (or not visible to the caller).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem409:
      description: Conflict with current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem422:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem429:
      description: Rate limited.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 Problem Details with a field-error extension.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          example: "https://tasker.dev/problems/validation-failed"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: integer, description: "epoch milliseconds" }
    UserBrief:
      type: object
      required: [id, display_name, email]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email }
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: integer }
        updated_at: { type: integer }
        my_role:
          type: [string, "null"]
          enum: [owner, admin, manager, member, null]
    Member:
      type: object
      required: [user, role, created_at]
      properties:
        user: { $ref: "#/components/schemas/UserBrief" }
        role: { type: string, enum: [owner, admin, manager, member] }
        created_at: { type: integer }
    Label:
      type: object
      required: [id, name, color, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        created_at: { type: integer }
    LabelBrief:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
    Project:
      type: object
      required: [id, team_id, name, status, owner_id, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [active, archived] }
        owner_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_at: { type: integer }
        updated_at: { type: integer }
        open_task_count: { type: integer }
        my_role: { type: [string, "null"], enum: [owner, admin, manager, member, null] }
    TaskCreate:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 250 }
        description: { type: string, maxLength: 10000 }
        status:
          type: string
          enum: [backlog, todo, in_progress]
          description: New tasks start in an actionable state; Done requires review acceptance.
        reporter_id:
          type: [string, "null"]
          description: |
            Acceptance reviewer. Defaults to the caller; selecting another
            user requires the Manager role or above and must be a team member.
        priority: { type: string, enum: [low, medium, high, urgent] }
        assignee_id:
          type: [string, "null"]
          description: Must be a team member.
        due_date:
          type: [string, "null"]
          format: date
        parent_task_id:
          type: [string, "null"]
          description: Subtask parent; must be a root task in the same project.
        label_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 250 }
        description: { type: [string, "null"], maxLength: 10000 }
        status:
          type: string
          enum: [backlog, todo, in_progress, in_review, done]
          description: |
            Validated against the workflow: In Progress -> In Review is a
            submission; In Review -> Done is an acceptance (reporter or
            Owner/Admin, never the assignee); In Review -> In Progress is a
            rejection/return; Done -> actionable states reopen the task
            (clearing the resolution).
        priority: { type: string, enum: [low, medium, high, urgent] }
        assignee_id:
          type: [string, "null"]
          description: Team member id; empty string clears the assignment.
        reporter_id:
          type: [string, "null"]
          description: |
            Acceptance reviewer; empty string resets to the caller. Changes
            require the Manager role or above and must reference a member.
        due_date:
          type: [string, "null"]
          format: date
        label_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    Task:
      type: object
      required:
        [id, team_id, project_id, title, status, priority, position, labels, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        parent_task_id: { type: [string, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { type: string, enum: [backlog, todo, in_progress, in_review, done] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assignee: { oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }] }
        reporter:
          description: User responsible for accepting or rejecting the work.
          oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }]
        created_by: { oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }] }
        resolution:
          description: Latest acceptance decision; absent during active work or a new cycle.
          type: [string, "null"]
          enum: [accepted, rejected, null]
        resolution_note: { type: [string, "null"] }
        resolved_by: { oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }] }
        resolved_at: { type: [integer, "null"], description: "epoch ms of the latest decision" }
        due_date: { type: [string, "null"], format: date }
        position: { type: number }
        completed_at: { type: [integer, "null"], description: "epoch ms; set while status is done" }
        labels:
          type: array
          items: { $ref: "#/components/schemas/LabelBrief" }
        created_at: { type: integer }
        updated_at: { type: integer }
        subtasks:
          type: array
          description: Present in task detail responses (one nesting level).
          items: { $ref: "#/components/schemas/Task" }
    PaginatedTasks:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    PaginatedMyTasks:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Task"
              - type: object
                required: [team_name, project_name]
                properties:
                  team_name: { type: string }
                  project_name: { type: string }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    TaskReject:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Audited with the rejection decision.
    Notification:
      type: object
      required: [id, event, summary, created_at]
      properties:
        id: { type: string, format: uuid }
        event:
          type: string
          enum:
            - task_assigned
            - comment_mention
            - task_submitted
            - task_accepted
            - task_rejected
            - task_status_changed
            - task_reporter_changed
        task_id: { type: [string, "null"], format: uuid }
        actor: { oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }] }
        summary:
          type: string
          maxLength: 300
          description: Frozen, human-readable summary captured when the event happened.
        created_at: { type: integer }
        read_at: { type: [integer, "null"] }
    PaginatedNotifications:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    Board:
      type: object
      required: [project_id, columns]
      properties:
        project_id: { type: string, format: uuid }
        columns:
          type: array
          items:
            type: object
            required: [status, total, items]
            properties:
              status: { type: string, enum: [backlog, todo, in_progress, in_review, done] }
              total: { type: integer }
              items:
                type: array
                items: { $ref: "#/components/schemas/Task" }
    Comment:
      type: object
      required: [id, task_id, author, body, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserBrief" }
        body: { type: string }
        created_at: { type: integer }
        updated_at: { type: integer }
    Activity:
      type: object
      required: [id, event, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: [string, "null"] }
        event:
          type: string
          enum:
            - task_created
            - task_updated
            - task_status_changed
            - task_priority_changed
            - task_assignee_changed
            - task_due_date_changed
            - task_deleted
            - comment_added
            - comment_edited
            - comment_deleted
        field: { type: [string, "null"] }
        old_value: { type: [string, "null"] }
        new_value: { type: [string, "null"] }
        actor: { oneOf: [{ $ref: "#/components/schemas/UserBrief" }, { type: "null" }] }
        created_at: { type: integer }
